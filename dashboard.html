<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مساحتك الشخصية</title>
<style>
:root{--bg:#07101f;--panel:#14243a;--line:rgba(154,190,236,.18);--text:#eef4ff;--muted:#9aabc4;--blue:#73a7ff;--green:#54d6a0}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 12% 8%,rgba(61,111,190,.24),transparent 38%),radial-gradient(ellipse at 88% 75%,rgba(65,191,163,.13),transparent 34%),linear-gradient(145deg,#07101f,#0c1930 55%,#101b30);color:var(--text);font-family:Tahoma,Arial,sans-serif;line-height:1.8}
.wrap{max-width:900px;margin:8vh auto;padding:24px 16px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:24px}
h1{font-size:clamp(27px,5vw,38px);margin:0}.muted{color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.card{display:block;text-decoration:none;color:var(--text);padding:30px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(145deg,rgba(25,40,64,.84),rgba(14,25,43,.78));box-shadow:0 18px 55px #0003;transition:transform .2s,border-color .2s}
.card:hover{transform:translateY(-4px);border-color:var(--blue)}.card .symbol{font-size:36px}.card h2{margin:12px 0 4px}.card p{color:var(--muted);margin:0}
button{border:1px solid var(--line);background:#1f314c;color:var(--text);padding:9px 14px;border-radius:10px;font:inherit;cursor:pointer}
@media(max-width:620px){.wrap{margin:24px auto}.cards{grid-template-columns:1fr}.card{padding:24px}}

/* Shared bottom navigation */
body{padding-bottom:100px}
.app-nav{position:fixed;z-index:1000;bottom:14px;left:50%;transform:translateX(-50%);width:min(440px,calc(100% - 24px));display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px;border:1px solid rgba(154,190,236,.22);border-radius:20px;background:rgba(9,19,34,.92);box-shadow:0 12px 40px #0008;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);direction:rtl}
.app-nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:58px;padding:5px 8px;border-radius:13px;color:#9aabc4;text-decoration:none;font-size:12px;transition:background .18s,color .18s}
.app-nav svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.app-nav a.active{color:#dceaff;background:rgba(67,119,190,.28);box-shadow:inset 0 0 0 1px rgba(115,167,255,.28)}
.app-nav a:focus-visible{outline:2px solid #73a7ff;outline-offset:2px}
@media(min-width:900px){.app-nav{bottom:18px}}
@media(max-width:420px){.app-nav{bottom:8px;width:calc(100% - 16px);padding:6px}.app-nav a{min-height:54px;font-size:11px}}
</style>
</head>
<body>
<main class="wrap">
<header class="top"><div><h1>مساحتك الشخصية</h1><div class="muted">اختار القسم اللي عايز تشتغل عليه.</div></div><button id="signOut">تسجيل الخروج</button></header>
<div class="cards">
<a class="card" href="/learning-plan.html"><div class="symbol">✓</div><h2>To-Do List</h2><p>تابع مهامك وخطة تعلمك وتقدمك الأسبوعي.</p></a>
<a class="card" href="/finance.html"><div class="symbol">↗</div><h2>Finance</h2><p>سجل دخلك ومصاريفك، وقارن أداءك المالي عبر الشهور والسنين.</p></a>
</div>
<p class="muted" id="status" role="status" aria-live="polite"></p>
</main>
<script type="module" src="/assets/dashboard.js"></script>
<nav class="app-nav" aria-label="التنقل الرئيسي">
 <a href="/dashboard.html" class="active" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg><span>الرئيسية</span></a>
 <a href="/learning-plan.html" class="" ><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v17H6.5A2.5 2.5 0 0 0 4 22z"/><path d="M4 5.5v14A2.5 2.5 0 0 1 6.5 17H20M8 7h8M8 11h8"/></svg><span>خطة التعلم</span></a>
 <a href="/finance.html" class="" ><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="15" rx="2"/><path d="M3 9h18M16 14h2"/></svg><span>المحفظة</span></a>
</nav>
</body>
</html>
