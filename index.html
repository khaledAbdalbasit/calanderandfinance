<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>حسابك — خطة التطور</title>
<style>
:root{--bg:#0b1220;--panel:#121d30;--line:#263650;--text:#eef4ff;--muted:#9aabc4;--red:#ff8e8e}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;min-height:100vh;background:linear-gradient(145deg,var(--bg),#101b2d);color:var(--text);font-family:Tahoma,sans-serif;line-height:1.8}
main{max-width:720px;margin:8vh auto;padding:24px 16px}
h1{font-size:clamp(26px,5vw,36px);margin:0 0 8px}h3{margin:0 0 16px;font-size:23px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px}
.muted{color:var(--muted)}.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{margin:12px 0}.field label{display:block;margin-bottom:6px}
input{width:100%;background:#0d1728;border:1px solid var(--line);border-radius:9px;padding:12px;color:var(--text);font:inherit}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}button,.plan-link{display:inline-block;border:1px solid var(--line);background:#17243a;color:var(--text);padding:10px 16px;border-radius:10px;font:inherit;cursor:pointer;text-decoration:none}
button.primary{background:#244a80;border-color:#3568a9}button:disabled{opacity:.55;cursor:wait}button:hover,.plan-link:hover{border-color:#73a7ff}a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid #73a7ff;outline-offset:3px}
.plan-link{margin-top:20px}@media(max-width:600px){main{margin:24px auto}.two{grid-template-columns:1fr;gap:0}.card{padding:18px}}
</style>
</head>
<body>
<main>
<header><h1>خطة التطور — 12 أسبوع</h1><p class="muted">تابع خطتك الأسبوعية وخطوات تطورك.</p></header>
<div class="card" id="authPanel" style="margin-top:16px">
 <h3>حسابك</h3>
 <form id="authForm">
  <div id="authFields" class="two">
   <div class="field"><label for="authEmail">البريد الإلكتروني</label><input type="email" id="authEmail" autocomplete="username" placeholder="name@example.com" dir="ltr" required></div>
   <div class="field"><label for="authPassword">كلمة المرور</label><input type="password" id="authPassword" autocomplete="current-password" placeholder="كلمة المرور" required></div>
  </div>
  <div class="actions">
   <button class="primary" id="signInBtn" type="submit" disabled>تسجيل الدخول</button>
   <button id="signUpBtn" type="button" disabled>إنشاء حساب</button>
   <button id="signOutBtn" type="button" hidden>تسجيل الخروج</button>
  </div>
 </form>
 <p id="authStatus" class="muted" role="status" aria-live="polite">جارٍ تحميل خدمة الحسابات…</p>
 <p class="muted">سجّل الدخول للوصول إلى خطتك. تقدمك وملاحظاتك تتم مزامنتها تلقائيًا مع حسابك، ويمكنك أيضًا تصدير نسخة احتياطية.</p>
 <noscript>فعّل JavaScript لاستخدام الحساب والخطة.</noscript>
</div>
</main>
<script type="module" src="/assets/auth.js"></script>
</body>
</html>
